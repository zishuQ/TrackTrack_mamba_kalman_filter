<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Track 比较器</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header-title">
          <div>
            <p class="eyebrow">TRACK VIEWER</p>
            <h1>结果对比浏览器</h1>
          </div>
        </div>
        <div class="header-controls">
          <div class="control-group">
            <span class="control-group-label">同步</span>
            <label class="toggle">
              <input id="syncToggle" type="checkbox" checked />
              左右同步
            </label>
            <label class="toggle">
              <input id="lockToggle" type="checkbox" />
              锁定帧差
            </label>
            <label class="toggle">
              <input id="followToggle" type="checkbox" checked />
              序列跟随
            </label>
            <div class="badge" id="deltaBadge">Δ: 0</div>
          </div>
          <div class="control-group">
            <span class="control-group-label">显示</span>
            <label class="toggle">
              <input id="idToggle" type="checkbox" checked />
              ID
            </label>
            <label class="toggle">
              <input id="gtIdToggle" type="checkbox" />
              GT ID
            </label>
            <label class="toggle">
              <input id="scoreToggle" type="checkbox" checked />
              置信度
            </label>
            <label class="toggle">
              <input id="diffToggle" type="checkbox" />
              仅差异
            </label>
            <label class="toggle">
              <input id="cacheToggle" type="checkbox" />
              缓存序列
            </label>
          </div>
          <div class="control-group">
            <span class="control-group-label">阈值</span>
            <label class="threshold">
              分数
              <input id="scoreThreshold" type="number" min="0" max="1" step="0.01" value="0" />
            </label>
            <div class="threshold-buttons">
              <button class="mini" data-threshold="0.3">0.3</button>
              <button class="mini" data-threshold="0.5">0.5</button>
              <button class="mini" data-threshold="0.7">0.7</button>
            </div>
            <label class="threshold">
              IoU
              <input id="iouThreshold" type="number" min="0.1" max="0.9" step="0.05" value="0.5" />
            </label>
          </div>
        </div>
        <div class="stats-bar">
          <span id="matchStats">匹配: -- | 左独有: -- | 右独有: --</span>
          <div class="stats-actions">
            <button class="mini" id="scanDiffBtn">扫描差异帧</button>
            <button class="mini" id="prevDiffBtn">上一差异帧</button>
            <button class="mini" id="nextDiffBtn">下一差异帧</button>
          </div>
          <span class="hint">快捷键: ←/→ 切帧, 点击面板切换焦点</span>
        </div>
      </header>

      <main class="grid">
        <section class="panel" id="leftPanel">
          <div class="panel-header">
            <h2>左侧结果</h2>
            <div class="selectors">
              <label>
                结果文件夹
                <select class="folderSelect"></select>
              </label>
              <label>
                序列
                <select class="sequenceSelect"></select>
              </label>
            </div>
          </div>

          <div class="controls">
            <button class="prevBtn">上一帧</button>
            <button class="nextBtn">下一帧</button>
            <label>
              帧号
              <input class="frameInput" type="number" min="1" />
            </label>
            <label>
              步长 n
              <input class="stepInput" type="number" min="1" value="1" />
            </label>
            <button class="goBtn">跳转</button>
          </div>

          <div class="meta">
            <span class="rangeLabel">帧范围: --</span>
            <span class="statusLabel"></span>
            <span class="countLabel"></span>
          </div>

          <div class="id-filter">
            <div class="id-filter-bar">
              <span class="idFilterSummary">当前帧 ID: --</span>
              <div class="id-filter-controls">
                <div class="threshold-buttons panelFilterModes">
                  <button class="mini active" type="button" data-filter-mode="track">Track ID</button>
                  <button class="mini" type="button" data-filter-mode="gt">GT ID</button>
                </div>
                <div class="id-filter-actions">
                  <button class="idFilterAction idShowAllBtn" type="button">全显</button>
                  <button class="idFilterAction idHideAllBtn" type="button">全隐藏</button>
                </div>
              </div>
            </div>
            <div class="idFilterChips"></div>
            <div class="idFilterEmpty">当前帧无可选 ID</div>
          </div>

          <div class="canvas-shell">
            <canvas class="viewerCanvas"></canvas>
            <div class="emptyState">等待加载</div>
          </div>
        </section>

        <section class="panel" id="rightPanel">
          <div class="panel-header">
            <h2>右侧结果</h2>
            <div class="selectors">
              <label>
                结果文件夹
                <select class="folderSelect"></select>
              </label>
              <label>
                序列
                <select class="sequenceSelect"></select>
              </label>
            </div>
          </div>

          <div class="controls">
            <button class="prevBtn">上一帧</button>
            <button class="nextBtn">下一帧</button>
            <label>
              帧号
              <input class="frameInput" type="number" min="1" />
            </label>
            <label>
              步长 n
              <input class="stepInput" type="number" min="1" value="1" />
            </label>
            <button class="goBtn">跳转</button>
          </div>

          <div class="meta">
            <span class="rangeLabel">帧范围: --</span>
            <span class="statusLabel"></span>
            <span class="countLabel"></span>
          </div>

          <div class="id-filter">
            <div class="id-filter-bar">
              <span class="idFilterSummary">当前帧 ID: --</span>
              <div class="id-filter-controls">
                <div class="threshold-buttons panelFilterModes">
                  <button class="mini active" type="button" data-filter-mode="track">Track ID</button>
                  <button class="mini" type="button" data-filter-mode="gt">GT ID</button>
                </div>
                <div class="id-filter-actions">
                  <button class="idFilterAction idShowAllBtn" type="button">全显</button>
                  <button class="idFilterAction idHideAllBtn" type="button">全隐藏</button>
                </div>
              </div>
            </div>
            <div class="idFilterChips"></div>
            <div class="idFilterEmpty">当前帧无可选 ID</div>
          </div>

          <div class="canvas-shell">
            <canvas class="viewerCanvas"></canvas>
            <div class="emptyState">等待加载</div>
          </div>
        </section>
      </main>
    </div>

    <div class="image-modal" id="imageModal" hidden>
      <div class="image-modal-dialog" id="imageModalDialog" role="dialog" aria-modal="true" aria-labelledby="imageModalTitle">
        <div class="image-modal-header">
          <div>
            <p class="eyebrow">IMAGE PREVIEW</p>
            <h2 id="imageModalTitle">当前可视化预览</h2>
          </div>
          <div class="image-modal-actions">
            <button class="modalAction" id="imageSaveBtn" type="button">保存 PNG</button>
            <button class="modalAction modalActionGhost" id="imageCloseBtn" type="button">关闭</button>
          </div>
        </div>
        <div class="image-modal-body">
          <img id="imageModalPreview" alt="当前可视化大图" />
        </div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
