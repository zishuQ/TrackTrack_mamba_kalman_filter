[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "scipy",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
