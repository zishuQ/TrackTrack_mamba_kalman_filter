iwg_rg_cma:
  epochs: 100
  batch_size: 1024
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 1
  grad_clip: 1.0
  seed: 42
  amp: false
  correction_bound: 0.05
  context_size: 6
  sequence_sampling: sqrt-size
  memory_shards: 4
  epochs_per_shard: 1
  shard_cycles: 25
  diagnostic_interval: 0
  log_interval: 0
